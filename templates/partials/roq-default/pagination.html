{! Override of the Roq default theme's pagination partial: the arrow-only links get a text label for screen readers. !}
<div class="container">
  {#include fm/pagination.html}
    {#newer}<i class="fa fa-long-arrow-left" aria-hidden="true"></i><span class="visually-hidden">Newer posts</span>{/newer}
    {#older}<i class="fa fa-long-arrow-right" aria-hidden="true"></i><span class="visually-hidden">Older posts</span>{/older}
  {/include}
</div>
